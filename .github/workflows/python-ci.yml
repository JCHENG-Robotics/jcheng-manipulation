name: python-analysis

# Pure-Python lint and tests for the analysis package and offline tools.
# ROS 2 / colcon builds are verified locally because the GitHub runner does
# not provide the project's ROS 2 Jazzy/Humble setup.

on:
  push:
    paths:
      - "ros2_ws/src/armpi_analysis/**"
      - "tools/phase2/**"
      - "tools/phase3/**"
      - "tools/phase4/**"
      - "tools/tests/**"
      - "tools/verify_config_consistency.py"
      - ".github/workflows/python-ci.yml"
  pull_request:
    paths:
      - "ros2_ws/src/armpi_analysis/**"
      - "tools/phase2/**"
      - "tools/phase3/**"
      - "tools/phase4/**"
      - "tools/tests/**"
      - "tools/verify_config_consistency.py"
      - ".github/workflows/python-ci.yml"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test tooling
        # PyYAML is imported by tools/phase2/measurement_protocol.py to read
        # ros2_ws/src/armpi_safety/config/safety_limits.yaml. numpy is imported
        # by the segmentation and camera tests; OpenCV is needed by the UVC
        # intrinsic test. The headless package avoids a GUI dependency.
        run: |
          python -m pip install --upgrade pip \
            pytest flake8 pyyaml numpy opencv-python-headless

      - name: Lint the analysis package and offline tools
        run: |
          python -m flake8 \
            ros2_ws/src/armpi_analysis \
            tools/phase4 \
            tools/verify_config_consistency.py \
            tools/tests \
            --select=E,F,W --ignore=W503 --max-line-length=79

      - name: Check limit and calibration consistency
        run: python tools/verify_config_consistency.py

      - name: Run pure-Python tests
        env:
          PYTHONPATH: ros2_ws/src/armpi_analysis
        run: |
          python -m pytest -q \
            ros2_ws/src/armpi_analysis/test/test_error_budget.py \
            ros2_ws/src/armpi_analysis/test/test_paired_trials.py \
            ros2_ws/src/armpi_analysis/test/test_host_benchmark.py \
            tools/phase2/tests \
            tools/phase3/tests \
            tools/phase4/tests \
            tools/tests

      - name: Run safety, planner and fiducial unit tests
        env:
          PYTHONPATH: ros2_ws/src/armpi_safety:ros2_ws/src/armpi_grasp_planner:ros2_ws/src/armpi_fiducial_localizer
        run: |
          python -m pytest -q \
            ros2_ws/src/armpi_safety/test/test_policy.py \
            ros2_ws/src/armpi_grasp_planner/test/test_joint_limits.py \
            ros2_ws/src/armpi_grasp_planner/test/test_candidates.py \
            ros2_ws/src/armpi_fiducial_localizer/test/test_detector.py \
            ros2_ws/src/armpi_fiducial_localizer/test/test_frames.py
