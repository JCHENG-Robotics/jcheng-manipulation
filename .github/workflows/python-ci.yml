name: python-analysis

# Pure-Python lint and tests for the analysis package and offline tools.
# ROS 2 / colcon builds are verified locally because the GitHub runner does
# not provide the project's ROS 2 Jazzy/Humble setup.

on:
  push:
    paths:
      - "ros2_ws/src/armpi_analysis/**"
      - "tools/phase2/**"
      - "tools/phase4/**"
      - ".github/workflows/python-ci.yml"
  pull_request:
    paths:
      - "ros2_ws/src/armpi_analysis/**"
      - "tools/phase2/**"
      - "tools/phase4/**"
      - ".github/workflows/python-ci.yml"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test tooling
        run: python -m pip install --upgrade pip pytest flake8

      - name: Lint the analysis package and phase-4 tools
        run: |
          python -m flake8 \
            ros2_ws/src/armpi_analysis \
            tools/phase4 \
            --select=E,F,W --ignore=W503 --max-line-length=79

      - name: Run pure-Python tests
        env:
          PYTHONPATH: ros2_ws/src/armpi_analysis
        run: |
          python -m pytest -q \
            ros2_ws/src/armpi_analysis/test/test_error_budget.py \
            ros2_ws/src/armpi_analysis/test/test_paired_trials.py \
            ros2_ws/src/armpi_analysis/test/test_host_benchmark.py \
            tools/phase2/tests/test_measurement_protocol.py \
            tools/phase4/tests
