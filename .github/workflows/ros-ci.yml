name: ros-colcon

# Build and test the project ROS 2 packages in the same Humble base image the
# robot uses. The vendor workspace (armpi_ultra_ws_clean) is intentionally not
# checked out; only the public packages listed below are built.
#
# The base image is pinned by tag here. When a registry digest is available,
# replace it with `ros:humble-ros-base@sha256:...` so the job cannot drift.

on:
  push:
    paths:
      - "ros2_ws/**"
      - "packages/jcheng_core/**"
      - "requirements/ci.txt"
      - ".github/workflows/ros-ci.yml"
  pull_request:
    paths:
      - "ros2_ws/**"
      - "packages/jcheng_core/**"
      - "requirements/ci.txt"
      - ".github/workflows/ros-ci.yml"

jobs:
  colcon:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ros:humble-ros-base
    env:
      DEBIAN_FRONTEND: noninteractive
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Install git for checkout
        # The base image has no git; install it before the checkout action.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates

      - uses: actions/checkout@v4

      - name: Install build and test dependencies
        # Explicit list instead of rosdep: the job is deterministic and does
        # not depend on rosdep key resolution. Every entry is a declared
        # build/exec/test dependency of the selected packages.
        run: |
          apt-get install -y --no-install-recommends \
            python3-colcon-common-extensions \
            python3-numpy \
            python3-opencv \
            python3-pip \
            python3-pykdl \
            python3-pytest \
            python3-setuptools \
            python3-yaml \
            ros-humble-ament-cmake \
            ros-humble-ament-copyright \
            ros-humble-ament-flake8 \
            ros-humble-ament-lint-auto \
            ros-humble-ament-lint-common \
            ros-humble-ament-pep257 \
            ros-humble-geometry-msgs \
            ros-humble-moveit-msgs \
            ros-humble-rosidl-default-generators \
            ros-humble-rosidl-default-runtime \
            ros-humble-sensor-msgs \
            ros-humble-tf2-geometry-msgs \
            ros-humble-tf2-ros \
            ros-humble-urdfdom-py \
            ros-humble-xacro

      - name: Build the public packages
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          PKGS="arm_interfaces armpi_analysis armpi_fiducial_localizer \
            armpi_grasp_planner armpi_safety armpi_ultra_description \
            armpi_ultra_moveit_config"
          colcon build \
            --base-paths ros2_ws/src \
            --packages-select $PKGS \
            --event-handlers console_cohesion+

      - name: Test the public packages
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          # armpi_analysis imports the shared pure-Python core from the repo.
          export PYTHONPATH="$GITHUB_WORKSPACE/packages/jcheng_core:$PYTHONPATH"
          PKGS="arm_interfaces armpi_analysis armpi_fiducial_localizer \
            armpi_grasp_planner armpi_safety armpi_ultra_description \
            armpi_ultra_moveit_config"
          colcon test \
            --base-paths ros2_ws/src \
            --packages-select $PKGS \
            --event-handlers console_cohesion+
          colcon test-result --verbose

      - name: Upload colcon logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: colcon-logs
          path: |
            log/
            build/*/test_results/
          if-no-files-found: ignore
