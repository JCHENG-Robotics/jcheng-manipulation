[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "armpi-debug-studio-backend"
version = "1.0.0rc1"
description = "ArmPi Debug Studio G1 Mock-first backend"
requires-python = ">=3.11,<3.13"
# Exact pins: the backend is an application, not a reusable library. The
# release gate and CI must resolve the same versions on every run.
dependencies = [
  "fastapi==0.163.0",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.14.3",
  "PyYAML==6.0.3",
  "numpy==1.26.4",
]

[project.optional-dependencies]
dev = [
  "pytest==9.2.0",
  "httpx==0.28.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
