# 2026-11-24: the camera launch runs on a loaded Pi 5 and the old
# TimeoutStartSec=180 was consumed by the readiness poll before the launch
# started. Keep a longer budget and retry a real failure (the unit is
# RemainAfterExit, so a successful run stays active and is not retried).
[Unit]
StartLimitIntervalSec=300
StartLimitBurst=5

[Service]
TimeoutStartSec=300
Restart=on-failure
RestartSec=20
