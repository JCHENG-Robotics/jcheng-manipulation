# Safety limits for ArmPi Ultra.
#
# Position bounds are the adopted limits (`mapping_version:
# measured-2026-11-19`, servo EEPROM limits minus a 20-pulse margin, with the
# measured joint2 high stop 795 - 20 = 775; see docs/phase2/JOINT_LIMITS.md and
# the MoveIt joint_limits.yaml). All five arm joints were surveyed by hand on
# 2026-11-19; the stops are pose-dependent self-collision limits, so these
# bounds are verified for the operating envelope rather than as universal
# mechanical stops. Velocity and acceleration limits are deliberately far
# below the URDF limits (10 rad/s, 1 rad/s^2) so a future executor cannot pass
# a fast trajectory through the veto layer.
schema_version: 1
source: EEPROM-bounded 2026-11-18 + formal stop survey 2026-11-19 (joint2 high tightened)

# Named, path-bound limit profiles. This block is the single authority for the
# apparent 4.0/20 vs 1.2/0.5 "contradiction": the fast G8 path is deliberately
# a separate profile, only reachable with its bus-verification and ACK gates.
# tools/verify_config_consistency.py checks every consumer against this table.
profiles:
  moveit:
    max_velocity_rad_s: 1.2
    max_acceleration_rad_s2: 0.5
    paths: [moveit_cli]
  step:
    max_step_rad: 0.35
    min_duration_s: 0.5
    max_duration_s: 10.0
    paths: [studio_g6]
  pose:
    max_velocity_rad_s: 0.5
    paths: [studio_g7, studio_g8_pose]
  fast:
    max_velocity_rad_s: 4.0
    max_acceleration_rad_s2: 20.0
    paths: [studio_g8_fast, fast_cli]
    requires_bus_verification: true

joint_limits:
  joint1:
    # EEPROM 50..950 pulse -> adopted 70..930.
    lower: -1.8012
    upper: 1.8012
    max_velocity: 1.2
    max_acceleration: 0.5
  joint2:
    # low mechanical stop 322 + 20 = 342; high hand-measured stop 795
    # (2026-11-19 low-pose survey) - 20 = 775 -> 1.1519.
    lower: -0.6618
    upper: 1.1519
    max_velocity: 1.2
    max_acceleration: 0.5
  joint3:
    # vendor mapping 500..1000 -> 0..-2.094; EEPROM 950 - 20 = 930.
    lower: -1.8012
    upper: 0.0
    max_velocity: 1.2
    max_acceleration: 0.5
  joint4:
    # EEPROM 100..900 pulse -> adopted 120..880.
    lower: -1.5917
    upper: 1.5917
    max_velocity: 1.2
    max_acceleration: 0.5
  joint5:
    # EEPROM 100..890 pulse -> adopted 120..870.
    lower: -1.5917
    upper: 1.5499
    max_velocity: 1.2
    max_acceleration: 0.5

state:
  # A stale or missing /joint_states stream is a stop condition.
  timeout_s: 0.5

start_state:
  # The first trajectory point must match the latest measured state.
  max_distance_rad: 0.08

trajectory:
  max_duration_s: 30.0
  max_points: 5000
  position_tolerance_rad: 0.001
  velocity_tolerance_rad_s: 0.001
  acceleration_tolerance_rad_s2: 0.001

workspace:
  frame: base_link
  enabled: true
  # Fail closed when FK is unavailable.
  required: true
  # The lower z is a coarse hard floor, NOT the table guard. The table is
  # tilted 3.66 deg (z spans about -0.096..-0.063 over y=-0.30..+0.30), so a
  # flat bound cannot represent it. The `table_plane` check below is the
  # operative clearance guard; keep it enabled when using this lower z.
  lower: [-0.05, -0.30, -0.10]
  upper: [0.45, 0.30, 0.55]

table_plane:
  # MEASURED 2026-11-18 (`depth_plane_optical_20261118.json`) with the depth
  # camera at table_down and confirmed by a 215 mm ruler check (1.3 mm).
  # Plane equation: normal . p + offset = 0. Signed height above the table is
  # normal . p + offset; the normal points up (+z). The table check vetoes a
  # tool point closer than clearance_m to the plane, which permits table
  # grasps without allowing the TCP below the surface. This is a TCP-only
  # guard; the table collision object (tools/phase2/table_collision.py) is
  # still required for arm/gripper geometry in the MoveIt planning scene.
  enabled: true
  frame: base_link
  normal: [0.010305373291790987, -0.06301369005824492, 0.9979594551616625]
  offset: 0.07728284112861183
  clearance_m: 0.01
