# Safety limits for ArmPi Ultra.
#
# Position bounds are the EEPROM-bounded values adopted on 2026-11-18
# (`mapping_version: eeprom-bounded-2026-11-18`, servo EEPROM limits minus a
# 20-pulse margin; see docs/phase2/JOINT_LIMITS.md and the MoveIt
# joint_limits.yaml). They are still not fully mechanically surveyed, so they
# are conservative command limits rather than a metrology claim. Velocity and
# acceleration limits are deliberately far below the URDF limits (10 rad/s,
# 1 rad/s^2) so a future executor cannot pass a fast trajectory through the
# veto layer.
schema_version: 1
source: EEPROM-bounded limits adopted 2026-11-18; mechanical survey partial

joint_limits:
  joint1:
    # EEPROM 50..950 pulse -> adopted 70..930.
    lower: -1.8012
    upper: 1.8012
    max_velocity: 1.2
    max_acceleration: 0.5
  joint2:
    # low mechanical stop 322 + 20 = 342; high EEPROM 830 - 20 = 810.
    lower: -0.6618
    upper: 1.2985
    max_velocity: 1.2
    max_acceleration: 0.5
  joint3:
    # vendor mapping 500..1000 -> 0..-2.094; EEPROM 950 - 20 = 930.
    lower: -1.8012
    upper: 0.0
    max_velocity: 1.2
    max_acceleration: 0.5
  joint4:
    # EEPROM 100..900 pulse -> adopted 120..880.
    lower: -1.5917
    upper: 1.5917
    max_velocity: 1.2
    max_acceleration: 0.5
  joint5:
    # EEPROM 100..890 pulse -> adopted 120..870.
    lower: -1.5917
    upper: 1.5499
    max_velocity: 1.2
    max_acceleration: 0.5

state:
  # A stale or missing /joint_states stream is a stop condition.
  timeout_s: 0.5

start_state:
  # The first trajectory point must match the latest measured state.
  max_distance_rad: 0.08

trajectory:
  max_duration_s: 30.0
  max_points: 5000
  position_tolerance_rad: 0.001
  velocity_tolerance_rad_s: 0.001
  acceleration_tolerance_rad_s2: 0.001

workspace:
  frame: base_link
  enabled: true
  # Fail closed when FK is unavailable.
  required: true
  lower: [-0.05, -0.30, 0.00]
  upper: [0.45, 0.30, 0.55]
