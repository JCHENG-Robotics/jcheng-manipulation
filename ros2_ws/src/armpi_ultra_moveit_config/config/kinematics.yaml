# ArmPi Ultra arm kinematics.
#
# The vendor config used TRAC-IK, but that plugin is not installed in this
# environment (MoveIt logged "failed to load"). KDL is used as the available
# fallback so the plugin can be instantiated.
#
# `position_only_ik: true` is for reachability / joint-space work only. It is
# NOT a valid final grasp IK policy for a 5-DoF arm; MASTER_PLAN_V3 §4 requires
# a constrained orientation. Install TRAC-IK or pick_ik and re-evaluate before
# visual grasping.
arm:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.05
  position_only_ik: true
