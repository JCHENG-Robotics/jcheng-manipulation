# ArmPi Ultra arm kinematics.
#
# The vendor config used TRAC-IK, but that plugin is not installed in this
# environment (MoveIt logged "failed to load"). KDL is used as the available
# fallback so the plugin can be instantiated.
#
# `position_only_ik: false` is deliberate: MASTER_PLAN_V3 §4 forbids using
# position-only IK as the final grasp solution, because an unconstrained tool
# orientation can produce a physically unusable grasp. A 5-DoF arm cannot reach
# arbitrary 6D poses, so grasp targets must come from the constrained candidate
# families in docs/phase0/ARMPI_5DOF_CONSTRAINTS.md, not from arbitrary pose
# goals.
#
# For pure reachability checks ("can the arm reach this point?"), use
# config/kinematics_reachability.yaml instead of editing this file.
arm:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.1
  position_only_ik: false
