# joint_limits.yaml — ArmPi Ultra (ADOPTED 2026-11-18)
#
# Source of the position bounds:
#   - servo EEPROM position limits (read-only, 2026-11-18) minus a 20-pulse
#     margin (20 pulses = 0.0838 rad = 4.8 deg)
#   - the one hand-measured mechanical stop that lies inside the EEPROM
#     range: joint2 low at 322 pulse
# Mechanical stops are NOT fully measured; joints 1 (low), 3 and 5 keep
# `mapping_verified=false`. Evidence: docs/phase2/JOINT_LIMITS.md and
# evidence/phase2/onsite_20261118/.

default_velocity_scaling_factor: 0.1
default_acceleration_scaling_factor: 0.1

joint_limits:
  joint1:
    # EEPROM 50..950 pulse -> adopted 70..930.
    has_position_limits: true
    min_position: -1.8012
    max_position: 1.8012
    has_velocity_limits: true
    max_velocity: 10.0
    has_acceleration_limits: true
    max_acceleration: 1.0
  joint2:
    # low mechanical stop 322 + 20 = 342 -> -0.6618; high EEPROM 830 - 20
    # = 810 -> 1.2985.
    has_position_limits: true
    min_position: -0.6618
    max_position: 1.2985
    has_velocity_limits: true
    max_velocity: 10.0
    has_acceleration_limits: true
    max_acceleration: 1.0
  joint3:
    # vendor mapping: raw 500..1000 -> 0..-2.094; EEPROM 950 - 20 = 930 ->
    # -1.8012. Do not allow positive joint3.
    has_position_limits: true
    min_position: -1.8012
    max_position: 0.0
    has_velocity_limits: true
    max_velocity: 10.0
    has_acceleration_limits: true
    max_acceleration: 1.0
  joint4:
    # EEPROM 100..900 pulse -> adopted 120..880.
    has_position_limits: true
    min_position: -1.5917
    max_position: 1.5917
    has_velocity_limits: true
    max_velocity: 10.0
    has_acceleration_limits: true
    max_acceleration: 1.0
  joint5:
    # EEPROM 100..890 pulse -> adopted 120..870.
    has_position_limits: true
    min_position: -1.5917
    max_position: 1.5499
    has_velocity_limits: true
    max_velocity: 10.0
    has_acceleration_limits: true
    max_acceleration: 1.0

  # Gripper. r_joint is the only actuated gripper joint; the others are mimic.
  # MEASURED 2026-11-18 19:59 (re-measured): increasing r_joint closes. Stops
  # are 0.0 (closed, raw 700, register 640) and -2.22 (open, raw 170,
  # register 188; linkage stop register 167 at raw ~150). The earlier -0.8378
  # open value was a binding stall, not the stop: it produced only a partial
  # finger opening. See docs/hardware/measured_joint_limits.md and
  # evidence/phase2/onsite_20261118/gripper_stops_20261118/.
  r_joint:
    has_position_limits: true
    min_position: -2.22
    max_position: 0.0
    has_velocity_limits: true
    max_velocity: 10.0
    has_acceleration_limits: true
    max_acceleration: 1.0
  l_in_joint:
    has_velocity_limits: true
    max_velocity: 10.0
    has_acceleration_limits: true
    max_acceleration: 1.0
  l_joint:
    has_velocity_limits: true
    max_velocity: 10.0
    has_acceleration_limits: true
    max_acceleration: 1.0
  l_out_joint:
    has_velocity_limits: true
    max_velocity: 10.0
    has_acceleration_limits: true
    max_acceleration: 1.0
  r_in_joint:
    has_velocity_limits: true
    max_velocity: 10.0
    has_acceleration_limits: true
    max_acceleration: 1.0
  r_out_joint:
    has_velocity_limits: true
    max_velocity: 10.0
    has_acceleration_limits: true
    max_acceleration: 1.0
