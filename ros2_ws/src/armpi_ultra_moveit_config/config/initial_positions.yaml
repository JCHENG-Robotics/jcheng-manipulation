# Default initial positions for armpi_ultra's ros2_control mock system.
#
# PROVISIONAL. The arm values below are the vendor startup-check pose converted
# with the vendor 240 deg / 1000 tick mapping:
#   (6,500) (5,600) (4,800) (3,110) (2,500) (1,210)
# The gripper was measured on 2026-11-18: increasing r_joint closes, mechanical
# range -0.8378 (open stop) .. 0.0 (closed stop). Simulation uses -0.80, a
# safe open position about 20 servo counts inside the open stop. See
# docs/hardware/measured_joint_limits.md.

initial_positions:
  joint1: 0.000
  joint2: 0.419
  joint3: -1.257
  joint4: -1.634
  joint5: 0.000
  r_joint: -0.800
